# Only the "triplets" profile: instances with a known perfect packing on which first/best
# fit decreasing are known to be suboptimal.
seed: 42
problem: binpacking
problem_options:
  n_items: 120
  capacity: 100
  profiles: [triplets]
population: 16
generations: 8
holdout_instances: 100
tracking_instances: 30
baselines_compete: false
arena:
  instances_per_round: 8
  elimination_fraction: 0.3
  finalists: 4
  max_rounds: 10
  workers: 4
  bootstrap_samples: 1000
hybrid:
  crossover_alpha: 0.3
  mutation_rate: 0.3
  mutation_scale: 0.1
  immigrants: 2
