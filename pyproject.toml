[project]
name = "stratarena"
version = "0.1.0"
description = "Choose strategies by simulation: battle-royale arenas, AI agents and hybridization."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Enzo Rangel" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.scripts]
stratarena = "stratarena.cli:main"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["stratarena"]
omit = ["*/_sandbox_runner.py"]  # runs only inside sandbox subprocesses
